<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actually Useful Form Filler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #333;
        }

        .popup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            text-align: center;
        }

        .popup-header h1 {
            font-size: 16px;
            font-weight: 600;
        }

        .popup-content {
            padding: 16px;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-fill {
            background: #10b981;
            color: white;
        }

        .btn-fill:hover {
            background: #059669;
        }

        .btn-settings {
            background: #f3f4f6;
            color: #333;
        }

        .btn-settings:hover {
            background: #e5e7eb;
        }

        .settings-section {
            margin-top: 16px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 4px;
            border-left: 3px solid #667eea;
        }

        .settings-section h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #667eea;
            margin-bottom: 8px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .toggle-item:last-child {
            margin-bottom: 0;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #dcfce7;
            color: #15803d;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .info-text {
            font-size: 12px;
            color: #6b7280;
            margin-top: 12px;
            padding: 8px;
            background: #fffbeb;
            border-radius: 4px;
            border-left: 2px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="popup-header">
        <h1>Actually Useful Form Filler</h1>
    </div>

    <div class="popup-content">
        <div class="button-group">
            <button class="btn-fill" id="fillBtn">Fill Form</button>
            <button class="btn-settings" id="settingsBtn">Settings</button>
        </div>

        <div class="button-group">
            <button class="btn-settings" id="pickerBtn" style="width: 100%;">Pick Fields to Skip</button>
        </div>

        <div class="button-group">
            <button class="btn-settings" id="customPickerBtn" style="width: 100%;">Set Custom Values</button>
        </div>

        <div class="settings-section">
            <h2>Quick Settings</h2>
            <div class="toggle-item">
                <label class="toggle-label">
                    <input type="checkbox" id="safeStrings">
                    Safe strings
                </label>
            </div>
            <div class="toggle-item">
                <label class="toggle-label">
                    <input type="checkbox" id="plausiblePhone">
                    Real phone #s
                </label>
            </div>
            <div class="toggle-item">
                <label class="toggle-label">
                    <input type="checkbox" id="reconcile">
                    Reconcile ZIP
                </label>
            </div>
            <div class="toggle-item">
                <label class="toggle-label">
                    <input type="checkbox" id="paintCanEnabled">
                    Paint can icon
                </label>
            </div>
        </div>

        <div id="status" class="status"></div>

        <div class="info-text">
            💡 Click the paint can icon next to the first form field to auto-fill any form
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
